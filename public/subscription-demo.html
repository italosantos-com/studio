<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000000">
  <title>iOS Subscription Sheet Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }

    .sheet {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
    }

    .sheet-handle {
      width: 36px;
      height: 5px;
      background: #d1d1d6;
      border-radius: 3px;
      margin: 0 auto 20px;
    }

    .sheet-header {
      text-align: center;
    }

    .sheet-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto;
      object-fit: cover;
    }

    .sheet-header h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 12px 0 4px;
      color: #000;
    }

    .sheet-header p {
      font-size: 14px;
      color: #6e6e73;
      margin: 0;
    }

    .sheet-plan {
      text-align: center;
      margin: 20px 0;
    }

    .sheet-price {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 5px;
      color: #000;
    }

    .sheet-price span {
      font-size: 14px;
      color: #6e6e73;
      font-weight: 400;
    }

    .sheet-plan p {
      font-size: 14px;
      color: #6e6e73;
      margin: 0;
    }

    .ios-primary-button {
      height: 50px;
      border-radius: 16px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    .ios-primary-button:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .sheet-footnote {
      text-align: center;
      font-size: 12px;
      color: #6e6e73;
      margin-top: 12px;
    }

    /* iOS Dark Mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: #000;
      }

      .sheet {
        background: #1c1c1e;
      }

      .sheet-handle {
        background: #3a3a3c;
      }

      .sheet-header h2 {
        color: #fff;
      }

      .sheet-header p,
      .sheet-price span,
      .sheet-plan p,
      .sheet-footnote {
        color: #a1a1a6;
      }

      .sheet-price {
        color: #fff;
      }

      .ios-primary-button {
        background: #0a84ff;
      }
    }
  </style>
</head>
<body>
  <div class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <img src="https://ui-avatars.com/api/?name=Italo+Santos&background=0a84ff&color=fff&size=160" class="sheet-avatar" alt="Profile">
        <h2>Italo Santos</h2>
        <p>Assinatura Premium</p>
      </div>

      <div class="sheet-plan">
        <div class="sheet-price">
          R$ 666,00 <span>/ mês</span>
        </div>
        <p>Acesso completo aos conteúdos</p>
      </div>

      <button class="ios-primary-button" onclick="handleConfirm()">
        Confirmar com Face ID
      </button>

      <p class="sheet-footnote">
        Cancelar a qualquer momento em Ajustes.
      </p>
    </div>
  </div>

  <script>
    function handleConfirm() {
      // Haptic feedback
      if ('vibrate' in navigator) {
        navigator.vibrate(10);
      }
      alert('Pagamento confirmado! 🎉');
    }
  </script>
</body>
</html>
